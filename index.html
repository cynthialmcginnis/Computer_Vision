<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIN 310 Unit 4: Computer Vision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #003366 0%, #004d99 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #f2f6fa;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        header {
            background-color: #003366;
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        header .subtitle {
            font-size: 22px;
            color: #f2a900;
            font-style: italic;
            margin-bottom: 10px;
        }

        header .tagline {
            font-size: 16px;
            color: #e8e8e8;
            max-width: 600px;
            margin: 0 auto;
        }

        .hero {
            background-color: #f2a900;
            padding: 30px;
            text-align: center;
            color: #003366;
        }

        .hero h2 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
        }

        .content {
            padding: 40px 30px;
        }

        .intro {
            background-color: white;
            border-left: 4px solid #f2a900;
            padding: 20px;
            margin-bottom: 40px;
            border-radius: 4px;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }

        .demos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .demo-card {
            background-color: white;
            border: 3px solid #003366;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .demo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            border-color: #f2a900;
        }

        .demo-card .chapter {
            display: inline-block;
            background-color: #f2a900;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            width: fit-content;
        }

        .demo-card h3 {
            color: #003366;
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .demo-card p {
            color: #555;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .demo-card .duration {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .demo-link {
            display: inline-block;
            background-color: #003366;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .demo-link:hover {
            background-color: #f2a900;
            color: #003366;
            transform: translateX(5px);
        }

        .section-title {
            color: #003366;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            border-bottom: 3px solid #f2a900;
            padding-bottom: 15px;
        }

        .key-insight {
            background-color: #f2f6fa;
            border-left: 4px solid #f2a900;
            padding: 20px;
            margin: 30px 0;
            border-radius: 4px;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            font-style: italic;
        }

        .chapter-mapping {
            background-color: white;
            border: 2px solid #003366;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .chapter-mapping table {
            width: 100%;
            border-collapse: collapse;
        }

        .chapter-mapping th {
            background-color: #003366;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
